<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="chat_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>chat_app</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Firebase Phone Auth on the web renders an invisible reCAPTCHA badge in the
    bottom-right corner. We hide it visually. Hiding it requires the visible
    attribution notice on the phone-number screen (see phone_login_view.dart),
    as required by Google's reCAPTCHA terms.
  -->
  <style>
    .grecaptcha-badge {
      visibility: hidden !important;
    }
  </style>
</head>
<body>
  <!--
    On Flutter web the browser keeps the last route in the URL hash. When the
    app is restarted from the IDE, Flutter/GetX parses that hash as the initial
    route before the GetX route tree is ready, which reopens screens such as
    /register (or leaves a blank page). Clear the hash before Flutter boots so
    every launch starts from the splash screen instead.
  -->
  <script>
    if (window.location.hash) {
      window.history.replaceState(
        null,
        '',
        window.location.pathname + window.location.search
      );
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
