name: chat_app
description: "A production-grade WhatsApp-inspired Messaging Application built with Flutter, GetX, and Firebase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  get: ^4.6.6

  # Firebase Services
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1

  # Local Caching & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Media & Utilities
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  video_player: ^2.8.2
  audioplayers: ^6.8.1
  file_picker: ^13.3.2
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.3.3
  permission_handler: ^12.0.1
  flutter_spinkit: ^5.2.0
  flutter_webrtc: ^1.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/patterns/
